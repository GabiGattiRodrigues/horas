name: Publicar a pagina

# Publica a pasta site/ no GitHub Pages (gabigattirodrigues.github.io/horas/).
# Os numeros ja estao dentro da pagina, gravados pelo scripts/exportar_pagina.py,
# entao aqui nao roda nenhuma analise.
#
# Roda so quando chamado (Actions > Publicar a pagina > Run workflow). Antes da
# primeira vez, ligar o Pages em Settings > Pages > Source: GitHub Actions --
# o token do workflow nao tem permissao para ligar o Pages sozinho.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
