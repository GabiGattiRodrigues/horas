[theme]
base = "light"
primaryColor = "#1f5fbf"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F6FA"
textColor = "#10233A"

[server]
# true: no Streamlit Cloud o app sobe sem esperar ninguem digitar e-mail.
# O rodar.bat abre o navegador sozinho com --server.headless false.
headless = true

[browser]
gatherUsageStats = false
